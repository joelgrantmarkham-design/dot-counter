<!DOCTYPE html>
<html>
<body style="margin:0;background:black;color:white;text-align:center;font-family:Arial,sans-serif;">

<h1>Fast Dot Counter</h1>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px;">
  <button onclick="startCamera()">Start Camera</button>
  <button onclick="flipCamera()">Flip Camera</button>
  <button onclick="toggleFreeze()" id="freezeBtn" style="font-size:28px;padding:18px 40px;border-radius:12px;background:#22c55e;color:white;border:none;font-weight:bold;">FREEZE</button>
</div>

<video id="video" autoplay playsinline style="width:100%;max-width:900px;background:#111;"></video>
<canvas id="canvas" style="display:none"></canvas>
<canvas id="overlay" style="position:absolute;left:50%;transform:translateX(-50%);top:110px;width:100%;max-width:900px;pointer-events:none;"></canvas>

<h2 id="count" style="font-size:56px;margin:16px 0 8px;">Count: 0</h2>
<p style="opacity:.8;padding:0 16px;max-width:900px;margin:0 auto 18px;">Use this for speed: point at the question screen, keep the dots inside the center box, then tap <b>Freeze</b> to lock the number.</p>

<script>
let video, canvas, overlay;
let currentFacingMode = "environment";
let currentStream = null;
let running = false;
let frozen = false;
let displayedCount = 0;

const BRIGHT_OFFSET = 55;
const MIN_AREA = 60;
const MAX_AREA = 5000;
const STEP = 2;

window.onload = () => {
  video = document.getElementById("video");
  canvas = document.getElementById("canvas");
  overlay = document.getElementById("overlay");
};

async function startCamera() {
  await openCamera(currentFacingMode);
}

async function flipCamera() {
  currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
  await openCamera(currentFacingMode);
}

function toggleFreeze() {
  frozen = !frozen;
  document.getElementById("freezeBtn").innerText = frozen ? "Resume" : "Freeze";
}

async function openCamera(facingMode) {
  try {
    stopCamera();

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    currentStream = stream;
    video.srcObject = stream;
    displayedCount = 0;
    frozen = false;
    document.getElementById("freezeBtn").innerText = "Freeze";

    await video.play();
    running = true;
    loop();
  } catch (error) {
    console.error(error);
    alert("Could not access that camera. Try again or check permissions.");
  }
}

function stopCamera() {
  running = false;
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
  }
}

function loop() {
  if (!running) return;
  if (!frozen) processFrame();
  requestAnimationFrame(loop);
}

function processFrame() {
  if (!video || !canvas || !overlay || !video.videoWidth) return;

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;
  overlay.width = w;
  overlay.height = h;

  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const octx = overlay.getContext("2d");
  ctx.drawImage(video, 0, 0, w, h);

  // Center scan box for faster, steadier counting
  const roi = {
    x: Math.floor(w * 0.18),
    y: Math.floor(h * 0.18),
    width: Math.floor(w * 0.64),
    height: Math.floor(h * 0.64)
  };

  const frame = ctx.getImageData(roi.x, roi.y, roi.width, roi.height);
  const rawCount = countDots(frame);

  // very light smoothing so it responds fast inside 15 seconds
  displayedCount = Math.abs(rawCount - displayedCount) >= 2
    ? rawCount
    : Math.round((displayedCount + rawCount) / 2);

  document.getElementById("count").innerText = `Count: ${displayedCount}`;
  drawOverlay(octx, roi);
}

function drawOverlay(octx, roi) {
  const w = overlay.width;
  const h = overlay.height;
  octx.clearRect(0, 0, w, h);

  octx.strokeStyle = frozen ? "#22c55e" : "rgba(255,255,255,0.95)";
  octx.lineWidth = 4;
  octx.strokeRect(roi.x, roi.y, roi.width, roi.height);

  octx.fillStyle = "rgba(0,0,0,0.55)";
  octx.fillRect(20, 20, 220, 70);
  octx.fillStyle = "white";
  octx.font = "bold 34px Arial";
  octx.fillText(displayedCount, 35, 65);
}

function countDots(imageData) {
  const { data, width, height } = imageData;
  const smallW = Math.floor(width / STEP);
  const smallH = Math.floor(height / STEP);
  const gray = new Uint8ClampedArray(smallW * smallH);

  let sum = 0;
  for (let y = 0; y < smallH; y++) {
    for (let x = 0; x < smallW; x++) {
      const srcX = x * STEP;
      const srcY = y * STEP;
      const i = (srcY * width + srcX) * 4;
      const g = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
      const idx = y * smallW + x;
      gray[idx] = g;
      sum += g;
    }
  }

  const avg = sum / gray.length;
  const threshold = Math.min(250, avg + BRIGHT_OFFSET);
  const binary = new Uint8Array(gray.length);

  for (let i = 0; i < gray.length; i++) {
    binary[i] = gray[i] >= threshold ? 1 : 0;
  }

  const clean = new Uint8Array(binary.length);
  for (let y = 1; y < smallH - 1; y++) {
    for (let x = 1; x < smallW - 1; x++) {
      let s = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          s += binary[(y + dy) * smallW + (x + dx)];
        }
      }
      clean[y * smallW + x] = s >= 5 ? 1 : 0;
    }
  }

  const visited = new Uint8Array(clean.length);
  let blobs = 0;

  for (let y = 1; y < smallH - 1; y++) {
    for (let x = 1; x < smallW - 1; x++) {
      const idx = y * smallW + x;
      if (!clean[idx] || visited[idx]) continue;

      const stack = [[x, y]];
      visited[idx] = 1;
      let area = 0;
      let minX = x, maxX = x, minY = y, maxY = y;

      while (stack.length) {
        const [cx, cy] = stack.pop();
        area++;
        if (cx < minX) minX = cx;
        if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy;
        if (cy > maxY) maxY = cy;

        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const nx = cx + dx;
            const ny = cy + dy;
            if (nx < 0 || ny < 0 || nx >= smallW || ny >= smallH) continue;
            const nidx = ny * smallW + nx;
            if (!visited[nidx] && clean[nidx]) {
              visited[nidx] = 1;
              stack.push([nx, ny]);
            }
          }
        }
      }

      const boxW = maxX - minX + 1;
      const boxH = maxY - minY + 1;
      const aspect = boxW / Math.max(boxH, 1);
      const scaledArea = area * STEP * STEP;

      if (
        scaledArea >= MIN_AREA &&
        scaledArea <= MAX_AREA &&
        aspect > 0.45 &&
        aspect < 2.2
      ) {
        blobs++;
      }
    }
  }

  return blobs;
}
</script>

</body>
</html>
