<!DOCTYPE html>
<html>
<body style="margin:0;background:black;color:white;text-align:center;font-family:Arial,sans-serif;">

<h1>Moving Dot Counter</h1>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;">
  <button onclick="startCamera()">Start Camera</button>
  <button onclick="flipCamera()">Flip Camera</button>
</div>

<video id="video" autoplay playsinline style="width:100%;max-width:900px;background:#111;"></video>
<canvas id="canvas" style="display:none"></canvas>

<h2 id="count">Count: 0</h2>

<script>
let video, canvas;
let prevFrame = null;
let currentFacingMode = "environment";
let currentStream = null;
let running = false;

window.onload = () => {
  video = document.getElementById("video");
  canvas = document.getElementById("canvas");
};

async function startCamera() {
  await openCamera(currentFacingMode);
}

async function flipCamera() {
  currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
  await openCamera(currentFacingMode);
}

async function openCamera(facingMode) {
  try {
    stopCamera();

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } },
      audio: false
    });

    currentStream = stream;
    video.srcObject = stream;
    prevFrame = null;

    await video.play();
    running = true;
    loop();
  } catch (error) {
    console.error(error);
    alert("Could not access that camera. Try again or check permissions.");
  }
}

function stopCamera() {
  running = false;
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
  }
}

function loop() {
  if (!running) return;
  processFrame();
  requestAnimationFrame(loop);
}

function processFrame() {
  if (!video || !canvas || !video.videoWidth) return;

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, w, h);

  const frame = ctx.getImageData(0, 0, w, h);
  const count = countMovingDots(frame);
  document.getElementById("count").innerText = "Count: " + count;
}

function countMovingDots(imageData) {
  const { data, width, height } = imageData;
  const gray = new Uint8ClampedArray(width * height);

  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = (data[i] + data[i + 1] + data[i + 2]) / 3;
  }

  if (!prevFrame) {
    prevFrame = gray;
    return 0;
  }

  const motion = new Uint8Array(width * height);

  for (let i = 0; i < gray.length; i++) {
    motion[i] = Math.abs(gray[i] - prevFrame[i]) > 25 ? 1 : 0;
  }

  prevFrame = gray;

  const visited = new Uint8Array(width * height);
  let blobs = 0;

  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const idx = y * width + x;
      if (!motion[idx] || visited[idx]) continue;

      const stack = [[x, y]];
      visited[idx] = 1;
      let area = 0;

      while (stack.length) {
        const [cx, cy] = stack.pop();
        area++;

        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const nx = cx + dx;
            const ny = cy + dy;

            if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;

            const nidx = ny * width + nx;
            if (!visited[nidx] && motion[nidx]) {
              visited[nidx] = 1;
              stack.push([nx, ny]);
            }
          }
        }
      }

      if (area > 20 && area < 2000) blobs++;
    }
  }

  return blobs;
}
</script>

</body>
</html>
